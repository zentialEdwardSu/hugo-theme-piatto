<header class="max-w-3xl pb-10 pt-16 sm:pb-12 sm:pt-24">
  <h1 class="text-4xl font-bold tracking-tight text-ink sm:text-5xl">{{ .Title }}</h1>
  {{ with .Description }}
    <div class="mt-4 max-w-2xl text-lg leading-8 text-muted sm:text-xl">
      {{ . | $.RenderString }}
    </div>
  {{ end }}
</header>
