{{- $name := .name -}}
{{- $class := printf "icon %s" (.class | default "") | strings.TrimSpace -}}
{{- $path := printf "icons/material/%s.svg" $name -}}
{{- with resources.Get $path -}}
  {{- replaceRE `<svg[^>]*>` (printf `<svg class="%s" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true" focusable="false">` $class) .Content | safeHTML -}}
{{- else -}}
  {{- errorf "Material Symbol %q is not available at assets/%s" $name $path -}}
{{- end -}}
