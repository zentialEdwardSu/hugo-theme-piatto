<div class="site-footer">
  <div class="site-footer__grid">
    <p class="site-footer__copyright">{{ .Site.Copyright }} {{ now.Format "2006" }}</p>
    {{ with .Site.Params.Social }}
      <ul class="site-footer__social" aria-label="Social links">
        {{ range . }}
          <li>
            <a class="site-footer__social-link" {{ with .rel }}rel="{{ . }}"{{ else }}rel="noopener noreferrer"{{ end }} href="{{ .link }}" target="_blank" aria-label="{{ .name }}" title="{{ .name }}">
              {{ partial "material-icon.html" (dict "name" .icon) }}
            </a>
          </li>
        {{ end }}
      </ul>
    {{ end }}
  </div>

  <p class="site-footer__credits">
    Powered by <a href="https://gohugo.io">Hugo</a>
    and <a href="https://tailwindcss.com">Tailwind CSS</a>.
  </p>
</div>
