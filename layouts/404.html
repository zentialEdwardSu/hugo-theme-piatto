{{ define "main" }}
<section class="max-w-2xl py-20 sm:py-28" aria-labelledby="not-found-title">
  <p class="text-sm font-semibold tabular-nums text-accent">404</p>
  <h1 id="not-found-title" class="mt-3 text-4xl font-bold tracking-tight text-ink sm:text-5xl">Page not found</h1>
  <p class="mt-5 text-lg leading-8 text-muted">The page may have moved, been deleted, or never existed.</p>
  <a href="{{ .Site.Home.RelPermalink }}" class="mt-8 inline-flex min-h-11 items-center rounded-ui border border-line bg-surface px-4 py-2 font-semibold text-ink transition-colors duration-150 hover:border-accent hover:text-accent">Back home</a>
</section>
{{ end }}
