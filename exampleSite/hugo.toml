baseURL = 'https://example.org/' # will usually be overwrote during build time
locale = 'en-US'
title = 'Piattos Example Site '
theme = "hugo-theme-piatto"
copyright = "MIT"
enableGitInfo = true
enableRobotsTXT = true
googleAnalytics = "The-G-MEASUREMENT_ID" # replace with your Google Analytics ID

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = 'package(-lock)?\.json'
    target = 'css'

[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'

[security]
  allowContent = ['^text/(html|markdown|css|plain)$', '^application/json$']
  [security.exec]
    allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']

[params]
  name = "Piatto"
  description = "A flat Hugo theme for articles, projects, and Typst documents."
  initials = "PT" # up-left icon
  showReadingTime=true # reading time
  search = true # if show search bar at main
  recentPosts = true # if show recent posts at main
  recentPostsCount = 4 # how much recent posts will be showed
  outOfDate = 2 # (months) 

  [params.navigation]
    showTaxonomies = true
    taxonomyLabel = "Tags"
    taxonomyURL = "/tags/"
    tagsLabel = "Tags"
    categoriesLabel = "Categories"

    [[params.navigation.tabs]]
      name = "Articles"
      url = "/articles/"
      listStyle = "rich"

    [[params.navigation.tabs]]
      name = "Projects"
      url = "/projects/"
      listStyle = "cards"
      dataSource = "projects"

    [[params.navigation.tabs]]
      name = "Me"
      url = "/me/"

  # social media params
  [[params.social]]
    name = "Twitter"
    link = "#"
    icon = "alternate_email"

  [[params.social]]
    name = "Github"
    link = "#"
    icon = "code"
  
  [[params.social]]
    name = "Gitlab"
    link = "#"
    icon = "account_tree"

  [[params.social]]
    name = "Mail" 
    link = "#"
    icon = "mail"

  [[params.social]]
    name = "LinkedIn"
    link = "#"
    icon = "badge"

[outputs]
  home = ["HTML", "RSS", "JSON", "LLMS", "LLMSFULL"]

[outputFormats]
  [outputFormats.LLMS]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true
  [outputFormats.LLMSFULL]
    mediaType = "text/plain"
    baseName = "llms-full"
    isPlainText = true
    notAlternative = true

# syntax highlight settings
[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    # Enable to include inline HTML
    unsafe = true

  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 1
